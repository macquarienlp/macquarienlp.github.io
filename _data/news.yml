- date: 31. March 2025
  headline: Our new website is up!
  content: We are excited to announce that our new website is now live! Here we will post updates about the research our group is conducting, as well as openings for prospective members.

- date: 24. October 2026
  headline: Our group have 15 papers accepted at EMNLP (A* conference)
  content: Our research group members will be presenting our works accepted into the 2026 Empirical Methods in Natural Language Processing (EMNLP), held in Budapest, Hungary. Congratulations to all staff and students who authored 15 papers that were accepted amongst the main conference and findings!

